name: Build architecture package matrix

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Build the complete matrix or a representative smoke subset
        required: true
        default: full
        type: choice
        options:
          - full
          - smoke
  push:
    branches:
      - main
    paths:
      - "codec-runtime/**"
      - "luci-app-videoplayer/**"
      - "scripts/build-dist.py"
      - "scripts/build-packages.py"
      - "scripts/codec_matrix.py"
      - "scripts/verify_codec_package.py"
      - "scripts/verify-dist.py"
      - "scripts/verify_packages.py"
      - ".github/workflows/codec-runtime.yml"
  pull_request:
    paths:
      - "codec-runtime/**"
      - "luci-app-videoplayer/**"
      - "scripts/build-dist.py"
      - "scripts/build-packages.py"
      - "scripts/codec_matrix.py"
      - "scripts/verify_codec_package.py"
      - "scripts/verify-dist.py"
      - "scripts/verify_packages.py"
      - ".github/workflows/codec-runtime.yml"

permissions:
  contents: read

concurrency:
  group: codec-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Validate and select build matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      scope: ${{ steps.matrix.outputs.scope }}

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Validate pinned architecture inventory
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/build-dist.py \
            scripts/codec_matrix.py \
            scripts/verify_codec_package.py \
            scripts/verify-dist.py
          python scripts/codec_matrix.py --summary

          scope=smoke
          if [[ "$EVENT_NAME" == workflow_dispatch && "$REQUESTED_SCOPE" == full ]]; then
            scope=full
          fi
          matrix="$(python scripts/codec_matrix.py --github-matrix --scope "$scope")"
          python - "$scope" "$matrix" <<'PY'
          import json
          import sys

          scope = sys.argv[1]
          entries = json.loads(sys.argv[2])["include"]
          expected = 71 if scope == "full" else 8
          if len(entries) != expected:
              raise SystemExit(
                  f"{scope} matrix has {len(entries)} entries instead of {expected}"
              )
          pairs = {(entry["format"], entry["arch"]) for entry in entries}
          if len(pairs) != len(entries):
              raise SystemExit("matrix contains a duplicate format/architecture pair")
          PY
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
          printf 'scope=%s\n' "$scope" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.format }} ${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PACKAGE_FORMAT: ${{ matrix.format }}
      PACKAGE_MANAGER: ${{ matrix.manager }}
      OPENWRT_ARCH: ${{ matrix.arch }}
      OPENWRT_RELEASE: ${{ matrix.release }}
      OPENWRT_REVISION: ${{ matrix.revision }}
      OPENWRT_TARGET: ${{ matrix.target }}
      OPENWRT_SUBTARGET: ${{ matrix.subtarget }}
      RELEASE_DIR: ${{ matrix.release_dir }}
      SDK_FILE: ${{ matrix.sdk_file }}
      SDK_URL: ${{ matrix.sdk_url }}
      SDK_SHA256: ${{ matrix.sdk_sha256 }}
      FEEDS_BUILDINFO_URL: ${{ matrix.feeds_buildinfo_url }}
      FEEDS_BUILDINFO_SHA256: ${{ matrix.feeds_buildinfo_sha256 }}
      PACKAGES_FEED_COMMIT: ${{ matrix.packages_feed_commit }}
      QEMU_EXECUTABLE: ${{ matrix.qemu }}
      VALIDATION_MODE: ${{ matrix.validation_mode }}
      FFMPEG_VERSION: ${{ matrix.ffmpeg_version }}
      FFMPEG_SHA256: ${{ matrix.ffmpeg_sha256 }}
      CODEC_RELEASE: ${{ matrix.codec_release }}
      CODEC_FILE: ${{ matrix.codec_file }}
      ARTIFACT_DIR: ${{ matrix.artifact_dir }}
      ARTIFACT_NAME: ${{ matrix.artifact_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install build and emulation tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils \
            build-essential \
            bzip2 \
            file \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            qemu-user-static \
            rsync \
            unzip \
            wget \
            xz-utils \
            zlib1g-dev \
            zstd \
            ffmpeg

      - name: Download and verify the official SDK metadata
        id: sdk
        run: |
          set -euo pipefail
          sdk_archive="$RUNNER_TEMP/$SDK_FILE"
          feeds_buildinfo="$RUNNER_TEMP/feeds.buildinfo"

          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 30 --output "$sdk_archive" "$SDK_URL"
          printf '%s  %s\n' "$SDK_SHA256" "$sdk_archive" |
            sha256sum --check --strict -

          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 30 --output "$feeds_buildinfo" \
            "$FEEDS_BUILDINFO_URL"
          printf '%s  %s\n' "$FEEDS_BUILDINFO_SHA256" "$feeds_buildinfo" |
            sha256sum --check --strict -
          grep -Fx \
            "src-git packages https://git.openwrt.org/feed/packages.git^$PACKAGES_FEED_COMMIT" \
            "$feeds_buildinfo"

          sdk_parent="$RUNNER_TEMP/openwrt-sdk"
          mkdir -p "$sdk_parent"
          tar --use-compress-program=unzstd -xf "$sdk_archive" -C "$sdk_parent"
          sdk_dir="$(find "$sdk_parent" -mindepth 1 -maxdepth 1 \
            -type d -print -quit)"
          [ -n "$sdk_dir" ] && [ -x "$sdk_dir/scripts/feeds" ]
          printf 'sdk_dir=%s\n' "$sdk_dir" >> "$GITHUB_OUTPUT"

      - name: Pin feeds and add the private package
        working-directory: ${{ steps.sdk.outputs.sdk_dir }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            "src-git packages https://git.openwrt.org/feed/packages.git^$PACKAGES_FEED_COMMIT" \
            > feeds.conf.default
          ./scripts/feeds update packages
          actual_commit="$(git -C feeds/packages rev-parse HEAD)"
          [ "$actual_commit" = "$PACKAGES_FEED_COMMIT" ]

          package_dir="package/luci-videoplayer-codec-runtime"
          mkdir -p "$package_dir"
          cp -a "$GITHUB_WORKSPACE/codec-runtime/package/." "$package_dir/"
          official_ffmpeg="feeds/packages/multimedia/ffmpeg/Makefile"
          grep -Fx "PKG_VERSION:=$FFMPEG_VERSION" "$official_ffmpeg"
          grep -Fx 'PKG_RELEASE:=1' "$official_ffmpeg"
          grep -Fx "PKG_HASH:=$FFMPEG_SHA256" "$official_ffmpeg"
          grep -Fx "PKG_VERSION:=$FFMPEG_VERSION" "$package_dir/Makefile"
          grep -Fx "PKG_RELEASE:=$CODEC_RELEASE" "$package_dir/Makefile"
          grep -Fx "PKG_HASH:=$FFMPEG_SHA256" "$package_dir/Makefile"

          official_patches="feeds/packages/multimedia/ffmpeg/patches"
          [ -d "$official_patches" ]
          cp -a "$official_patches" "$package_dir/patches"

          cat > "$package_dir/files/build-info" <<EOF
          format=3
          openwrt_release=$OPENWRT_RELEASE
          openwrt_revision=$OPENWRT_REVISION
          compatible_arch=$OPENWRT_ARCH
          build_target=$OPENWRT_TARGET
          build_subtarget=$OPENWRT_SUBTARGET
          sdk_sha256=$SDK_SHA256
          packages_feed_commit=$PACKAGES_FEED_COMMIT
          ffmpeg_version=$FFMPEG_VERSION
          package_format=$PACKAGE_FORMAT
          validation_mode=$VALIDATION_MODE
          build_patented=y
          network_enabled=n
          avdevice_enabled=n
          swresample_enabled=y
          audio_output=pcm_s16le
          audio_sample_rate=48000
          audio_channels=2
          audio_chunk_frames=12000
          audio_chunk_bytes=48000
          private_binary=/usr/libexec/videoplayer-ffmpeg/ffmpeg
          EOF
          if grep -Eq '@[A-Z_]+@' "$package_dir/files/build-info"; then
            echo "Unexpanded build-info placeholder." >&2
            exit 1
          fi

      - name: Configure the SDK target
        working-directory: ${{ steps.sdk.outputs.sdk_dir }}
        run: |
          set -euo pipefail
          touch .config
          sed -i \
            -e '/^CONFIG_BUILD_PATENTED=/d' \
            -e '/^# CONFIG_BUILD_PATENTED is not set$/d' \
            -e '/^CONFIG_PACKAGE_luci-videoplayer-codec-runtime=/d' \
            -e '/^# CONFIG_PACKAGE_luci-videoplayer-codec-runtime is not set$/d' \
            .config
          printf '%s\n' \
            'CONFIG_BUILD_PATENTED=y' \
            'CONFIG_PACKAGE_luci-videoplayer-codec-runtime=y' \
            >> .config
          make defconfig

          target_symbol="${OPENWRT_TARGET//-/_}"
          subtarget_symbol="${OPENWRT_SUBTARGET//-/_}"
          grep -Fx "CONFIG_TARGET_${target_symbol}=y" .config
          grep -Fx \
            "CONFIG_TARGET_${target_symbol}_${subtarget_symbol}=y" \
            .config
          grep -Fx 'CONFIG_BUILD_PATENTED=y' .config
          grep -Fx \
            'CONFIG_PACKAGE_luci-videoplayer-codec-runtime=y' \
            .config

      - name: Build the private codec runtime
        working-directory: ${{ steps.sdk.outputs.sdk_dir }}
        run: |
          set -euo pipefail
          make -j2 package/luci-videoplayer-codec-runtime/compile V=s

      - name: Validate package isolation and codec features
        id: package
        working-directory: ${{ steps.sdk.outputs.sdk_dir }}
        run: |
          set -euo pipefail
          mapfile -t package_source_binaries < <(
            find build_dir -type f \
              -path '*/.pkgdir/luci-videoplayer-codec-runtime/usr/libexec/videoplayer-ffmpeg/ffmpeg' \
              -print
          )
          if (( ${#package_source_binaries[@]} != 1 )); then
            echo "Expected one package-source FFmpeg, found ${#package_source_binaries[@]}." >&2
            printf '  %s\n' "${package_source_binaries[@]}" >&2
            exit 1
          fi
          package_source_binary="${package_source_binaries[0]}"
          [ -x "$package_source_binary" ]
          suffix="/usr/libexec/videoplayer-ffmpeg/ffmpeg"
          package_root="${package_source_binary%$suffix}"

          find "$package_root" \( -type f -o -type l \) \
            -printf '%P\n' | LC_ALL=C sort > "$RUNNER_TEMP/package-files.txt"
          printf '%s\n' \
            'usr/libexec/videoplayer-ffmpeg/ffmpeg' \
            'usr/share/luci-videoplayer-codec-runtime/build-info' \
            > "$RUNNER_TEMP/expected-package-files.txt"
          diff -u \
            "$RUNNER_TEMP/expected-package-files.txt" \
            "$RUNNER_TEMP/package-files.txt"

          build_info="$package_root/usr/share/luci-videoplayer-codec-runtime/build-info"
          grep -Fx 'format=3' "$build_info"
          grep -Fx "openwrt_release=$OPENWRT_RELEASE" "$build_info"
          grep -Fx "openwrt_revision=$OPENWRT_REVISION" "$build_info"
          grep -Fx "compatible_arch=$OPENWRT_ARCH" "$build_info"
          grep -Fx "build_target=$OPENWRT_TARGET" "$build_info"
          grep -Fx "build_subtarget=$OPENWRT_SUBTARGET" "$build_info"
          grep -Fx "sdk_sha256=$SDK_SHA256" "$build_info"
          grep -Fx "packages_feed_commit=$PACKAGES_FEED_COMMIT" "$build_info"
          grep -Fx "package_format=$PACKAGE_FORMAT" "$build_info"

          mapfile -t target_staging_candidates < <(
            find staging_dir -mindepth 1 -maxdepth 1 \
              -type d -name 'target-*_musl*' -print
          )
          if (( ${#target_staging_candidates[@]} != 1 )); then
            echo "Expected one target staging directory, found ${#target_staging_candidates[@]}." >&2
            printf '  %s\n' "${target_staging_candidates[@]}" >&2
            exit 1
          fi
          target_staging="${target_staging_candidates[0]}"
          sysroot="$(find "$target_staging" -mindepth 1 -maxdepth 1 \
            -type d -name 'root-*' -print -quit)"
          [ -n "$sysroot" ] && [ -d "$sysroot/lib" ]
          config_h="$(find build_dir -type f \
            -path '*/.pkgdir/.videoplayer-validation/config.h' \
            -print -quit)"
          component_config="$(find build_dir -type f \
            -path '*/.pkgdir/.videoplayer-validation/config_components.h' \
            -print -quit)"
          [ -n "$config_h" ] && [ -n "$component_config" ]
          if [[ "$VALIDATION_MODE" == qemu ]]; then
            command -v "$QEMU_EXECUTABLE"
          fi

          mapfile -t packages < <(
            find bin -type f -name "$CODEC_FILE" -print
          )
          if (( ${#packages[@]} != 1 )); then
            echo "Expected one $CODEC_FILE, found ${#packages[@]}." >&2
            printf '  %s\n' "${packages[@]}" >&2
            exit 1
          fi
          package="${packages[0]}"
          [ -s "$package" ]
          file "$package"
          packaged_binary="$RUNNER_TEMP/packaged-videoplayer-ffmpeg"
          python "$GITHUB_WORKSPACE/scripts/verify_codec_package.py" \
            "$package" \
            --format "$PACKAGE_FORMAT" \
            --architecture "$OPENWRT_ARCH" \
            --build-info "$build_info" \
            --extract-binary "$packaged_binary"

          chmod +x "$GITHUB_WORKSPACE/codec-runtime/validate-runtime.sh"
          VALIDATION_TIMEOUT=300 \
            "$GITHUB_WORKSPACE/codec-runtime/validate-runtime.sh" \
            "$packaged_binary" "$sysroot" "$RUNNER_TEMP/codec-validation" \
            "$QEMU_EXECUTABLE" "$VALIDATION_MODE" \
            "$config_h" "$component_config"

          artifact_root="$RUNNER_TEMP/codec-runtime-artifact"
          artifact_target="$artifact_root/$ARTIFACT_DIR"
          mkdir -p "$artifact_target"
          cp "$package" "$artifact_target/$CODEC_FILE"
          cp "$build_info" "$artifact_target/BUILD_INFO"
          (
            cd "$artifact_target"
            sha256sum "$CODEC_FILE" > "$CODEC_FILE.sha256"
          )
          printf 'artifact_root=%s\n' "$artifact_root" >> "$GITHUB_OUTPUT"

      - name: Upload validated codec package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ steps.package.outputs.artifact_root }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish complete architecture package tree
    needs:
      - prepare
      - build
    if: >-
      needs.prepare.outputs.scope == 'full' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'communism420/luci-app-videoplayer'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Download all validated codec packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: codec-*
          path: ${{ runner.temp }}/codec-artifacts
          merge-multiple: true

      - name: Assemble and verify dist tree
        env:
          SOURCE_DATE_EPOCH: "1767225600"
        run: |
          set -euo pipefail
          publish_root="$GITHUB_WORKSPACE/.codec-publish"
          codec_source="$RUNNER_TEMP/codec-artifacts/dist"
          [ -d "$codec_source" ]
          [ ! -e "$codec_source/SOURCE_COMMIT" ]
          printf '%s\n' "$GITHUB_SHA" > "$codec_source/SOURCE_COMMIT"
          python scripts/build-dist.py \
            --output-dir "$publish_root/dist" \
            --codec-source "$codec_source" \
            --require-codecs \
            --source-commit "$GITHUB_SHA"
          python scripts/verify-dist.py \
            --dist "$publish_root/dist" \
            --require-codecs
          printf '%s\n' \
            '# Current architecture package snapshot' \
            '' \
            'This branch is generated from the pinned OpenWrt SDK matrix.' \
            "All packages were built from main commit \`$GITHUB_SHA\`." \
            'Folder names are exact OpenWrt `DISTRIB_ARCH` values.' \
            'Do not edit this branch manually.' \
            > "$publish_root/README.md"
          [ -z "$(find "$publish_root" -type l -print -quit)" ]

      - name: Publish generated codec-snapshot branch
        env:
          SNAPSHOT_BRANCH: codec-snapshot
          PUBLISH_DIR: ${{ github.workspace }}/.codec-publish
        run: |
          set -euo pipefail
          remote_main="$(
            git ls-remote origin refs/heads/main |
              awk 'NR == 1 { print $1 }'
          )"
          if [[ "$remote_main" != "$GITHUB_SHA" ]]; then
            echo "Main changed while the matrix was building; refusing stale publication." >&2
            exit 1
          fi

          previous_snapshot="$(
            git ls-remote origin "refs/heads/$SNAPSHOT_BRANCH" |
              awk 'NR == 1 { print $1 }'
          )"
          if [[ -n "$previous_snapshot" && ! "$previous_snapshot" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The codec snapshot branch returned an invalid commit." >&2
            exit 1
          fi

          index_file="$RUNNER_TEMP/codec-snapshot-index-$GITHUB_RUN_ID"
          trap 'rm -f -- "$index_file"' EXIT
          GIT_INDEX_FILE="$index_file" \
            git --work-tree="$PUBLISH_DIR" add --force --all
          snapshot_tree="$(
            GIT_INDEX_FILE="$index_file" git write-tree
          )"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          snapshot_commit="$(
            printf 'Publish architecture packages built from %s\n' "$GITHUB_SHA" |
              git commit-tree "$snapshot_tree"
          )"

          current_snapshot="$(
            git ls-remote origin "refs/heads/$SNAPSHOT_BRANCH" |
              awk 'NR == 1 { print $1 }'
          )"
          if [[ "$current_snapshot" != "$previous_snapshot" ]]; then
            echo "The codec snapshot branch changed before publication." >&2
            exit 1
          fi

          remote_main="$(
            git ls-remote origin refs/heads/main |
              awk 'NR == 1 { print $1 }'
          )"
          if [[ "$remote_main" != "$GITHUB_SHA" ]]; then
            echo "Main changed before publication; refusing stale codec packages." >&2
            exit 1
          fi

          git push origin \
            "$snapshot_commit:refs/heads/$SNAPSHOT_BRANCH" \
            "--force-with-lease=refs/heads/$SNAPSHOT_BRANCH:$previous_snapshot"
