name: Package checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    package-check-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  package-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Check source syntax
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in (
              Path("scripts/build-packages.py"),
              Path("scripts/verify_packages.py"),
          ):
              compile(path.read_text(encoding="utf-8"), str(path), "exec")

          for path in Path("luci-app-videoplayer").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          PY
          sh -n scripts/install-from-github.sh
          shellcheck -s sh scripts/install-from-github.sh
          sh -n scripts/install-main-apk.sh
          shellcheck -s sh scripts/install-main-apk.sh
          sh -n scripts/install-to-router.sh
          bash -n tests/renderer-behavior.sh
          shellcheck -s bash tests/renderer-behavior.sh
          sh -n luci-app-videoplayer/root/etc/uci-defaults/80_luci-videoplayer
          sh -n luci-app-videoplayer/root/usr/libexec/rpcd/luci.videoplayer
          sh -n luci-app-videoplayer/root/usr/libexec/videoplayer-renderer
          sh -n luci-app-videoplayer/root/www/cgi-bin/videoplayer-stream
          sh -n luci-app-videoplayer/root/www/cgi-bin/videoplayer-frame
          shellcheck -s sh scripts/install-to-router.sh
          shellcheck -s sh -e SC3043 \
            luci-app-videoplayer/root/etc/uci-defaults/80_luci-videoplayer \
            luci-app-videoplayer/root/www/cgi-bin/videoplayer-stream
          shellcheck -s sh -e SC1091,SC3043 \
            luci-app-videoplayer/root/usr/libexec/rpcd/luci.videoplayer
          shellcheck -s sh -e SC3043,SC2329 \
            luci-app-videoplayer/root/usr/libexec/videoplayer-renderer
          shellcheck -s sh \
            luci-app-videoplayer/root/www/cgi-bin/videoplayer-frame
          {
            printf '%s\n' '(function () {'
            cat luci-app-videoplayer/htdocs/luci-static/resources/view/videoplayer/main.js
            printf '%s\n' '})();'
          } > /tmp/videoplayer-main-wrapped.js
          node --check /tmp/videoplayer-main-wrapped.js

      - name: Exercise renderer lifecycle
        shell: bash
        run: sudo bash tests/renderer-behavior.sh "$GITHUB_WORKSPACE"

      - name: Build, verify, and compare reproducible outputs
        env:
          SOURCE_DATE_EPOCH: "1767225600"
        run: python scripts/build-packages.py --check-reproducible

      - name: Verify existing outputs through the standalone CLI
        run: python scripts/build-packages.py --verify-only

  publish-main-apk:
    name: Publish current main APK
    needs: package-check
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'communism420/luci-app-videoplayer'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Rebuild and verify the APK
        env:
          SOURCE_DATE_EPOCH: "1767225600"
        run: python scripts/build-packages.py --check-reproducible

      - name: Publish the APK to the snapshot branch
        shell: bash
        env:
          SNAPSHOT_BRANCH: snapshot
          SNAPSHOT_APK: luci-app-videoplayer-main.apk
        run: |
          set -euo pipefail

          remote_main="$(
            git ls-remote origin refs/heads/main |
              awk 'NR == 1 { print $1 }'
          )"
          if [[ ! "$remote_main" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve the current main commit." >&2
            exit 1
          fi
          if [[ "$remote_main" != "$GITHUB_SHA" ]]; then
            echo "::notice::Skipping stale build for $GITHUB_SHA; main is now $remote_main."
            exit 0
          fi

          shopt -s nullglob
          built_apks=(dist/luci-app-videoplayer-*.apk)
          if (( ${#built_apks[@]} != 1 )); then
            echo "Expected exactly one built APK, found ${#built_apks[@]}." >&2
            exit 1
          fi

          publish_dir="$(mktemp -d)"
          index_file="$RUNNER_TEMP/videoplayer-snapshot-index-$GITHUB_RUN_ID"
          cleanup() {
            rm -rf -- "$publish_dir"
            rm -f -- "$index_file"
          }
          trap cleanup EXIT

          cp -- "${built_apks[0]}" "$publish_dir/$SNAPSHOT_APK"
          (
            cd "$publish_dir"
            sha256sum "$SNAPSHOT_APK" > "$SNAPSHOT_APK.sha256"
            printf '%s\n' "$GITHUB_SHA" > SOURCE_COMMIT
            printf '%s\n' \
              '# Current main APK' \
              '' \
              'This branch is generated by GitHub Actions after all package checks pass.' \
              "The APK was built from main commit \`$GITHUB_SHA\`." \
              'Do not edit this branch manually.' \
              > README.md
          )

          previous_snapshot="$(
            git ls-remote origin "refs/heads/$SNAPSHOT_BRANCH" |
              awk 'NR == 1 { print $1 }'
          )"
          parent_args=()
          if [[ -n "$previous_snapshot" ]]; then
            if [[ ! "$previous_snapshot" =~ ^[0-9a-f]{40}$ ]]; then
              echo "The snapshot branch returned an invalid commit." >&2
              exit 1
            fi
            git fetch --no-tags --depth=1 origin "refs/heads/$SNAPSHOT_BRANCH"
            fetched_snapshot="$(git rev-parse FETCH_HEAD)"
            if [[ "$fetched_snapshot" != "$previous_snapshot" ]]; then
              echo "The snapshot branch changed while it was being fetched." >&2
              exit 1
            fi
            parent_args=(-p "$previous_snapshot")
          fi

          rm -f -- "$index_file"
          GIT_INDEX_FILE="$index_file" \
            git --work-tree="$publish_dir" add --all
          snapshot_tree="$(
            GIT_INDEX_FILE="$index_file" git write-tree
          )"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          snapshot_commit="$(
            printf 'Publish APK built from %s\n' "$GITHUB_SHA" |
              git commit-tree "$snapshot_tree" "${parent_args[@]}"
          )"

          remote_main="$(
            git ls-remote origin refs/heads/main |
              awk 'NR == 1 { print $1 }'
          )"
          if [[ ! "$remote_main" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not recheck the current main commit." >&2
            exit 1
          fi
          if [[ "$remote_main" != "$GITHUB_SHA" ]]; then
            echo "::notice::Skipping stale build for $GITHUB_SHA; main is now $remote_main."
            exit 0
          fi

          git push origin "$snapshot_commit:refs/heads/$SNAPSHOT_BRANCH"
