name: Package checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    package-check-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  package-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Check source syntax
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in (
              Path("scripts/build-dist.py"),
              Path("scripts/build-packages.py"),
              Path("scripts/codec_matrix.py"),
              Path("scripts/verify_codec_package.py"),
              Path("scripts/verify-dist.py"),
              Path("scripts/verify_packages.py"),
          ):
              compile(path.read_text(encoding="utf-8"), str(path), "exec")

          for path in Path("luci-app-videoplayer").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          json.loads(Path("codec-runtime/matrix.json").read_text(encoding="utf-8"))
          PY
          sh -n scripts/install-from-github.sh
          shellcheck -s sh scripts/install-from-github.sh
          sh -n scripts/install-main-apk.sh
          shellcheck -s sh scripts/install-main-apk.sh
          sh -n scripts/install-codec-runtime.sh
          shellcheck -s sh scripts/install-codec-runtime.sh
          sh -n scripts/install-to-router.sh
          sh -n codec-runtime/validate-runtime.sh
          shellcheck -s sh codec-runtime/validate-runtime.sh
          bash -n tests/local-listing.sh
          shellcheck -s bash tests/local-listing.sh
          bash -n tests/installer-entrypoints.sh
          shellcheck -s bash tests/installer-entrypoints.sh
          bash -n tests/renderer-behavior.sh
          shellcheck -s bash tests/renderer-behavior.sh
          node --check tests/web-audio.js
          sh -n luci-app-videoplayer/root/etc/uci-defaults/80_luci-videoplayer
          sh -n luci-app-videoplayer/root/usr/libexec/rpcd/luci.videoplayer
          sh -n luci-app-videoplayer/root/usr/libexec/videoplayer-renderer
          sh -n luci-app-videoplayer/root/www/cgi-bin/videoplayer-stream
          sh -n luci-app-videoplayer/root/www/cgi-bin/videoplayer-frame
          sh -n luci-app-videoplayer/root/www/cgi-bin/videoplayer-audio
          shellcheck -s sh scripts/install-to-router.sh
          shellcheck -s sh -e SC3043 \
            luci-app-videoplayer/root/etc/uci-defaults/80_luci-videoplayer \
            luci-app-videoplayer/root/www/cgi-bin/videoplayer-stream \
            luci-app-videoplayer/root/www/cgi-bin/videoplayer-audio
          shellcheck -s sh -e SC1091,SC3043 \
            luci-app-videoplayer/root/usr/libexec/rpcd/luci.videoplayer
          shellcheck -s sh -e SC3043,SC2329 \
            luci-app-videoplayer/root/usr/libexec/videoplayer-renderer
          shellcheck -s sh \
            luci-app-videoplayer/root/www/cgi-bin/videoplayer-frame
          python scripts/codec_matrix.py --summary
          [ "$(python scripts/codec_matrix.py --list-architectures | wc -l)" -eq 37 ]
          [ "$(
            python scripts/codec_matrix.py --github-matrix |
              python -c 'import json,sys; print(len(json.load(sys.stdin)["include"]))'
          )" -eq 71 ]
          grep -Fx \
            'define Package/luci-videoplayer-codec-runtime' \
            codec-runtime/package/Makefile
          grep -Fx 'format=3' codec-runtime/package/files/build-info.template
          grep -Fx 'openwrt_release=@OPENWRT_RELEASE@' \
            codec-runtime/package/files/build-info.template
          grep -Fx 'package_format=@PACKAGE_FORMAT@' \
            codec-runtime/package/files/build-info.template
          grep -Fx 'validation_mode=@VALIDATION_MODE@' \
            codec-runtime/package/files/build-info.template
          grep -E \
            '^LUCI_DEPENDS:=.*\+coreutils-timeout([[:space:]]|$)' \
            luci-app-videoplayer/Makefile
          grep -F 'max-parallel: 8' .github/workflows/codec-runtime.yml
          grep -F 'SNAPSHOT_BRANCH: codec-snapshot' \
            .github/workflows/codec-runtime.yml
          {
            printf '%s\n' '(function () {'
            cat luci-app-videoplayer/htdocs/luci-static/resources/view/videoplayer/main.js
            printf '%s\n' '})();'
          } > /tmp/videoplayer-main-wrapped.js
          node --check /tmp/videoplayer-main-wrapped.js

      - name: Exercise browser PCM scheduling
        shell: bash
        run: node tests/web-audio.js

      - name: Exercise local media listing
        shell: bash
        run: bash tests/local-listing.sh "$GITHUB_WORKSPACE"

      - name: Exercise remote installer entry points
        shell: bash
        run: bash tests/installer-entrypoints.sh "$GITHUB_WORKSPACE"

      - name: Exercise renderer lifecycle
        shell: bash
        run: sudo bash tests/renderer-behavior.sh "$GITHUB_WORKSPACE"

      - name: Build, verify, and compare reproducible outputs
        env:
          SOURCE_DATE_EPOCH: "1767225600"
        run: >-
          python scripts/build-packages.py
          --output-dir "$RUNNER_TEMP/dist-lowlevel"
          --check-reproducible

      - name: Verify existing outputs through the standalone CLI
        run: >-
          python scripts/build-packages.py
          --output-dir "$RUNNER_TEMP/dist-lowlevel"
          --verify-only

      - name: Assemble and verify architecture-scoped app layout
        env:
          SOURCE_DATE_EPOCH: "1767225600"
        run: |
          python scripts/build-dist.py \
            --output-dir dist \
            --source-commit "$GITHUB_SHA"
          python scripts/verify-dist.py --dist dist

      - name: Reject linked distribution output
        run: |
          set -euo pipefail
          mkdir -p .staging/output-link-target
          ln -s output-link-target .staging/output-link
          if python scripts/build-dist.py \
            --output-dir .staging/output-link \
            --source-commit "$GITHUB_SHA"
          then
            echo "build-dist accepted a symbolic-link output." >&2
            exit 1
          fi

  publish-main-packages:
    name: Publish current main package layout
    needs: package-check
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'communism420/luci-app-videoplayer'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Rebuild and verify the architecture package layout
        env:
          SOURCE_DATE_EPOCH: "1767225600"
        run: |
          python scripts/build-dist.py \
            --output-dir .snapshot-publish/dist \
            --source-commit "$GITHUB_SHA"
          python scripts/verify-dist.py --dist .snapshot-publish/dist
          printf '%s\n' \
            '# Current main architecture packages' \
            '' \
            'This branch is generated after all package checks pass.' \
            "Packages were built from main commit \`$GITHUB_SHA\`." \
            'Folder names are exact OpenWrt `DISTRIB_ARCH` values.' \
            'Codec placeholders are filled by the separate codec-snapshot build.' \
            'Do not edit this branch manually.' \
            > .snapshot-publish/README.md

      - name: Publish the layout to the snapshot branch
        shell: bash
        env:
          SNAPSHOT_BRANCH: snapshot
          PUBLISH_DIR: ${{ github.workspace }}/.snapshot-publish
        run: |
          set -euo pipefail

          remote_main="$(
            git ls-remote origin refs/heads/main |
              awk 'NR == 1 { print $1 }'
          )"
          if [[ ! "$remote_main" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve the current main commit." >&2
            exit 1
          fi
          if [[ "$remote_main" != "$GITHUB_SHA" ]]; then
            echo "::notice::Skipping stale build for $GITHUB_SHA; main is now $remote_main."
            exit 0
          fi

          index_file="$RUNNER_TEMP/videoplayer-snapshot-index-$GITHUB_RUN_ID"
          cleanup() {
            rm -f -- "$index_file"
          }
          trap cleanup EXIT

          [ -s "$PUBLISH_DIR/dist/INDEX.json" ]
          [ -s "$PUBLISH_DIR/dist/INDEX.tsv" ]
          [ -s "$PUBLISH_DIR/dist/SOURCE_COMMIT" ]
          [ -z "$(find "$PUBLISH_DIR" -type l -print -quit)" ]

          previous_snapshot="$(
            git ls-remote origin "refs/heads/$SNAPSHOT_BRANCH" |
              awk 'NR == 1 { print $1 }'
          )"
          parent_args=()
          if [[ -n "$previous_snapshot" ]]; then
            if [[ ! "$previous_snapshot" =~ ^[0-9a-f]{40}$ ]]; then
              echo "The snapshot branch returned an invalid commit." >&2
              exit 1
            fi
            git fetch --no-tags --depth=1 origin "refs/heads/$SNAPSHOT_BRANCH"
            fetched_snapshot="$(git rev-parse FETCH_HEAD)"
            if [[ "$fetched_snapshot" != "$previous_snapshot" ]]; then
              echo "The snapshot branch changed while it was being fetched." >&2
              exit 1
            fi
            parent_args=(-p "$previous_snapshot")
          fi

          rm -f -- "$index_file"
          GIT_INDEX_FILE="$index_file" \
            git --work-tree="$PUBLISH_DIR" add --force --all
          snapshot_tree="$(
            GIT_INDEX_FILE="$index_file" git write-tree
          )"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          snapshot_commit="$(
            printf 'Publish architecture packages built from %s\n' "$GITHUB_SHA" |
              git commit-tree "$snapshot_tree" "${parent_args[@]}"
          )"

          remote_main="$(
            git ls-remote origin refs/heads/main |
              awk 'NR == 1 { print $1 }'
          )"
          if [[ ! "$remote_main" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not recheck the current main commit." >&2
            exit 1
          fi
          if [[ "$remote_main" != "$GITHUB_SHA" ]]; then
            echo "::notice::Skipping stale build for $GITHUB_SHA; main is now $remote_main."
            exit 0
          fi

          git push origin "$snapshot_commit:refs/heads/$SNAPSHOT_BRANCH"
